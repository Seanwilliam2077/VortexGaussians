<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>空心</title>
  <link rel="stylesheet" href="work.css">
</head>
<body>
  <main>
    <header><h1>空心</h1></header>
    <div class="picture"><canvas id="view" width="720" height="720" role="img" aria-label="同一火影像朝向四方，围住中央黑方；四边依次停住"></canvas></div>
    <div class="controls" aria-label="播放控制">
      <button id="play" type="button" disabled>播放</button>
      <button id="pause" type="button" disabled>暂停</button>
      <button id="leave" type="button">离开</button>
      <p id="status" role="status" aria-live="polite">正在准备影像。</p>
    </div>
    <p class="source-note">火影像来自 VortexGaussians。同一段影像经旋转与裁切，静默呈示二十二秒。</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <iframe id="source" src="../../../../demo/index.html?embed=1&amp;solver=vpm&amp;orbit=0" title="原平台影像源" tabindex="-1" aria-hidden="true"></iframe>
  <script type="module" src="work.mjs"></script>
</body>
</html>
